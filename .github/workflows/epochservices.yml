# Builds EpochServices for the three operating systems it supports.
#
# ## Why this exists
#
# EpochServices is the program a *second* machine runs, and that machine usually has no Rust, no
# Xcode and no reason to acquire either — its job is to lend a graphics card. Asking somebody to
# install a toolchain before they can lend their own hardware is most of the friction in the
# whole feature.
#
# A `.dmg` can only be produced on macOS: Tauri does not cross-compile from Windows or Linux, and
# the bundle needs Apple's own tooling. So the machine that builds it is a macOS runner here
# rather than a Mac somebody has to own and set up.
#
# ## What it does not do
#
# It does not sign or notarise. An unsigned `.dmg` makes macOS refuse the first launch until the
# user opens it through **right-click → Open**, and that instruction ships with the download
# rather than being hidden. Signing needs an Apple Developer account and secrets in this
# repository, and neither is a decision this file should make quietly.
#
# What it does instead is **say what it produced**: a `SHA256SUMS` beside the bundles, so
# somebody who downloads one can check that it is the file this job built. That is not a
# signature and does not pretend to be — it is only worth anything because it travels a
# different path from the file, which is why it is printed into the job log as well.
#
# ## And it runs the tests first
#
# It built a bundle without ever running the suite, so a release could be cut from a tree that
# does not pass. The full checks live in `ci.yml`; this repeats the one that decides whether the
# thing being shipped works.
#
# ## Triggered by hand
#
# On demand, not on every push. This compiles a webview toolkit three times; running it because
# somebody fixed a comment would be minutes of somebody else's electricity for nothing.

name: EpochServices

on:
  workflow_dispatch:
  push:
    tags:
      - "services-v*"

permissions:
  contents: read

jobs:
  # The same rule, and this workflow needs it more: it publishes three platforms with provenance
  # on a `services-v*` tag, and `ci.yml` is where EpochServices' formatting, lints, tests and
  # dependency policy actually run.
  gates:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gates

    strategy:
      # One platform failing must not cancel the other two: a broken Linux dependency should
      # still leave a usable .dmg to download.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      # A job that only builds should not be able to write; this one signs a statement about
      # what it built, and that needs exactly these two.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The webview on Linux is not part of the image. On macOS and Windows the system provides
      # one, which is the whole reason this program has no frontend build.
      - name: Linux webview dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # Keyed on the lock file: EpochServices is its own workspace, so Epoch's dependencies are
      # not in this cache and must not be.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-services-${{ hashFiles('Cargo.lock') }}

      # **Before the bundle, not after.** A release cut from a tree that does not pass is a
      # release nobody can trust, and finding that out from the artefact is finding out too late.
      - name: Tests
        run: cargo test --locked

      - name: Build the bundle
        run: cargo install tauri-cli --version "^2" --locked && cargo tauri build

      # A checksum for every bundle, and printed into the log as well: a list that travels with
      # the file it describes proves only that they arrived together.
      #
      # **The names written here are the names the person checking will have.** These bundles are
      # produced in separate directories — `nsis/`, `msi/`, `dmg/`, `deb/` — and a Release page is
      # flat: `gh release create` uploads every asset under its basename. Writing the paths
      # `shasum` walked would publish a file that answers `FAILED open or read` for everything.
      #
      # Not hypothetical. Epoch's own v0.1.0 draft shipped exactly that, and it was found by
      # downloading it rather than by reading it — the bytes were correct and the instrument that
      # proves they are correct was the broken part, failing in the direction that reads as
      # tampering. Two bundles sharing a basename stop the build rather than publishing two lines
      # nobody can tell apart.
      - name: What this job produced
        shell: bash
        working-directory: target/release/bundle
        run: |
          set -euo pipefail
          find . -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' \
            -o -name '*.AppImage' -o -name '*.rpm' \) | sort > /tmp/bundles
          if [ "$(wc -l < /tmp/bundles)" -ne "$(xargs -n1 basename < /tmp/bundles | sort -u | wc -l)" ]; then
            echo "two bundles share a basename; the Release page cannot hold both" >&2
            exit 1
          fi
          : > SHA256SUMS
          while read -r f; do
            ( cd "$(dirname "$f")" && shasum -a 256 "$(basename "$f")" )
          done < /tmp/bundles >> SHA256SUMS
          cat SHA256SUMS

      # **What is inside it**, which neither the checksum nor the provenance says. 294 Rust
      # components here — the day an advisory lands on one of them, this is the difference
      # between a `grep` and reconstructing the dependency tree of a version already downloaded.
      #
      # No `npm sbom` on this side: this program has no frontend of its own.
      #
      # **One per platform, named after it.** The three builds do not have the same dependency
      # tree — Windows pulls crates macOS never sees — so a single list would be true about one
      # machine and quietly wrong about the other two. And three files called
      # `epochservices.cargo.cdx.json` cannot sit on one flat Release page anyway: the second
      # would overwrite the first, which is the same collision the checksums are guarded against.
      - name: Install the parts-list tool
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: What is inside it
        shell: bash
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --spec-version 1.5
          mkdir -p target/release/bundle
          mv epoch-services.cdx.json \
            "target/release/bundle/epochservices.${{ matrix.name }}.cargo.cdx.json"
          f="target/release/bundle/epochservices.${{ matrix.name }}.cargo.cdx.json"
          grep -q '"bomFormat"' "$f" || { echo "not a CycloneDX document"; exit 1; }
          echo "$f  $(grep -o '"bom-ref"' "$f" | wc -l) entries"

      # **What a signature would have bought, minus the part that costs money.** Not *who made
      # it* — that is a certificate, and this project does not have one — but *where it came
      # from*: GitHub signs this through Sigstore, and
      # `gh attestation verify <file> --repo <owner>/<repo>` checks it against a transparency
      # log. A tampered bundle cannot claim to have come from here.
      #
      # It does not make macOS open the app. Nothing but notarisation does, and that needs a
      # paid Apple account. The instruction for the first launch ships with the download.
      - name: Where these came from
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/*.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: epochservices-${{ matrix.name }}
          # Every bundle format this platform produced. Naming them individually would mean
          # editing this file the day Tauri adds one.
          path: |
            target/release/bundle/**/*
          if-no-files-found: error
  # **Somewhere a person can actually download from.**
  #
  # Everything above builds three platforms and signs a statement about what it built, and all of
  # it was landing on a workflow run: an artefact expires, and reaching one takes a signed-in
  # browser. A release that a stranger cannot download is a release that did not happen.
  #
  # **A separate job, for the reason the one above has `contents: read`.** A job that builds must
  # not be able to write to the repository, and a job that publishes has no business compiling
  # anything. This one downloads what was already built and attested and does nothing else — so
  # what it publishes is the artefact the attestation is about, rather than a second build of the
  # same source that would hash differently.
  #
  # **A draft.** The owner reads it and presses the button; nothing here publishes on its own.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/services-v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # No `name:`, so all three platforms' artefacts arrive, each in its own directory.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release

      - name: One page, three platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find release -type f | sort

          # **One list per platform, and that was measured rather than preferred.** Three files
          # called SHA256SUMS cannot sit on a flat page, so the obvious fix was to concatenate
          # them into one. Run against a real download it answers:
          #
          #   EpochServices_0.1.0_aarch64.dmg: FAILED open or read
          #   WARNING: 3 listed files could not be read              exit 1
          #
          # — for an intact file, because nobody downloads three platforms. Three FAILED lines
          # and a non-zero exit is the instrument reading as tampering, which is the defect this
          # release chain has already shipped once. `--ignore-missing` answers it and needs the
          # reader to know a flag; a file per platform removes the failure altogether.
          #
          # The artefact directories are named `epochservices-<platform>`, so the name comes from
          # what produced it rather than from a list written here.
          for d in release/epochservices-*/; do
            platform="$(basename "$d" | sed 's|^epochservices-||')"
            cp "$d/SHA256SUMS" "SHA256SUMS-$platform"
            echo "--- $platform"
            cat "SHA256SUMS-$platform"
          done

          # Everything a person downloads, flattened. A basename collision would already have
          # stopped the build that produced it.
          find release -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' \
            -o -name '*.AppImage' -o -name '*.rpm' -o -name '*.cdx.json' \) | sort > /tmp/assets
          if [ "$(wc -l < /tmp/assets)" -ne "$(xargs -n1 basename < /tmp/assets | sort -u | wc -l)" ]; then
            echo "two artefacts share a basename across platforms" >&2
            exit 1
          fi

          cat > notes.md <<'NOTES'
          **Lend another computer's models to your crew.**

          EpochServices runs on a machine that has a graphics card — a desktop, a Mac in another
          room — and makes its models available to [Epoch](https://github.com/KislokX/Epoch), so a
          character on your laptop can think on that machine's card.

          It is small and single-purpose. It holds no crew, no Quests, no Chronicles and no
          knowledge: it lends compute, and it says exactly what it is lending.

          ## What it does

          | | |
          |---|---|
          | **Lends runtimes** | Ollama, llama.cpp and LM Studio, whichever are installed |
          | **Weighs a model** | real byte counts against this card's memory, measured here rather than guessed by the Host |
          | **Finds and pulls models** | Hugging Face and Ollama, onto the disk where they will actually run |
          | **Lends a studio** | ComfyUI on this machine, so a picture is drawn on the card that can draw it |

          **Pairing is a code, typed once.** Press `SHOW A CODE` here, type it into Epoch under
          `MACHINES` with this machine's address. The code is spent the moment it works. No
          account, no cloud, no sign-in.

          **Every runtime stays on `127.0.0.1`.** Ollama, llama.cpp and LM Studio are never exposed
          to your network. The only thing listening is this program, and it answers nobody without
          the secret your Host gave it.

          Grants are separate questions with separate answers: *may think for me* and *may drive my
          World from there*.

          ## Which file

          | | |
          |---|---|
          | Windows | `*-setup.exe` (per user) or `*.msi` |
          | macOS | `*.dmg` |
          | Linux | `*.deb` or `*.AppImage` |

          ## Checking what you have

          It is **unsigned**, and that is a decision rather than an omission: a certificate is a
          recurring cost and it buys *who made this*, which is the half a stranger can least act
          on. The half you can check is free and ships with every release.

          There is one list per platform — take the one matching what you downloaded, so the
          check is about your file and not about the two you did not take.

          ```
          sha256sum -c SHA256SUMS-windows       # or -macos, or -linux
          shasum -a 256 -c SHA256SUMS-macos     # macOS spells it this way
          gh attestation verify <the file you downloaded> --repo OWNER_REPO
          ```

          The first says the file you have is the file this job produced. The second says it came
          from this commit of this repository, built on GitHub's own runners and signed through a
          public transparency log.

          **Neither stops the operating system's warning.** Windows shows *"Windows protected your
          PC"* — *More info*, then *Run anyway*. macOS refuses an unnotarised app: **System
          Settings → Privacy & Security**, then **Open Anyway**. Notarisation needs a paid Apple
          account, and saying otherwise would be a claim this project does not make.

          The `.cdx.json` files are CycloneDX parts lists, one per platform, because the three
          builds do not have the same dependency tree.
          NOTES
          sed -i "s|OWNER_REPO|${GITHUB_REPOSITORY}|" notes.md

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            SHA256SUMS-* $(cat /tmp/assets)
